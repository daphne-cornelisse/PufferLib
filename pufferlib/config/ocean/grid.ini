[base]
package = ocean
env_name = puffer_grid
policy_name = Policy
rnn_name = Recurrent

[policy]
hidden_size = 512

[rnn]
input_size = 512
hidden_size = 512

[vec]
num_envs = 16
num_workers = 16
backend = Serial

[env]
size = -1 # If size != -1, we always generate mazes of this size
max_size = 31 #51 # If size == -1, we generate mazes *up to* this size
horizon = 500 # If horizon != -1, we use a fixed episode horizon
speed = 1.0
vision = 5
difficulty = 0.8
discretize = True
num_envs = 1024
num_maps = 1

[train]
log_detailed_stats = False
log_coverage_grid = True # Only works in serial vec envs
optimizer = muon

