vf_coef = 2.323141961227481
vtrace_c_clip = 1.2499497264614237
vtrace_rho_clip = 4.7398234531013985

# World model coefficients
wm_clip_coef = 10.0
wm_reward_coef = 0.2

[sweep]
method = Protein 
metric = cum_coverage
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
downsample = 0
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 6e8
mean = 3e8
scale = time

