[base]
; Package namespace.
package = ocean
; Env id.
env_name = puffer_pushworld
; Policy class.
policy_name = Policy
; RNN policy class.
rnn_name = Recurrent

[policy]
; MLP hidden size.
hidden_size = 512

[rnn]
; LSTM input size.
input_size = 512
; LSTM hidden size.
hidden_size = 512

[vec]
; Vectorization backend.
backend = PufferEnv
; Native backend uses a single Python env.
num_envs = 1


[env]
; Puzzle root dir.
puzzle_dir = resources/pushworld/puzzles/train
; Level filter.
levels = [1]
; Fixed map path.
train_map = "level1/Irrelevant Obstacles Small.pwp"
; Map index override.
train_map_idx = -1
; Max puzzles (0 = all).
max_puzzles = 0
; Egocentric vision size (odd).
vision = 25
; Episode length cap.
max_episode_length = 150
; Parallel agents in env.
num_envs = 4096
; Log aggregation interval.
report_interval = 32
; Count-based reward coef.
count_based_reward_coef = 0.0
; Count-based global counts.
count_based_global = 1

[train]
; Optimizer.
optimizer = muon
; Learning rate.
learning_rate = 0.003
; LR annealing.
anneal_lr = False
; Grad clip.
max_grad_norm = 0.25
; AMP (cuda only).
amp = False
; Entropy coef.
ent_coef = 0.005
; BPTT horizon.
bptt_horizon = 128
; WM loss clip.
wm_clip_coef = 10.0
; WM reward coef.
wm_reward_coef = 0.0
; Solve reward threshold.
solve_reward_threshold = 9.5
; WM continuous obs size.
wm_continuous_obs_size = 0
; WM tile types.
wm_num_tile_types = 7
; Total timesteps.
total_timesteps = 3_000_000_000
; Checkpoint interval (epochs).
checkpoint_interval = 200
; GIF interval (steps).
gif_interval_steps = 10_000_000
; GIF length (frames).
gif_frames = 256
; GIF FPS.
gif_fps = 10
; GIF tile size.
gif_tile_size = 16
; GIF output dir.
gif_dir = experiments/gifs
; GIF randomize seed.
gif_randomize = True
; GIF fixed seed.
gif_seed = None
; GIF full map.
gif_full_map = True
; GIF random map.
gif_map_random = False
; GIF fixed map idx.
gif_map_idx = None
; Map eval interval (steps).
map_eval_interval_steps = 2_000_000
; Map eval batch.
map_eval_batch = 64
; Map eval test dir.
map_eval_test_dir = resources/pushworld/puzzles/test
; Coverage interval (steps).
coverage_interval_steps = 2_000_000
; Coverage map path.
coverage_map = "level1/Irrelevant Obstacles Small.pwp"
; Coverage output dir.
coverage_dir = experiments/coverage
; Accumulate coverage.
coverage_accumulate = True
; Stop on solve.
stop_on_solve = False
; Min steps before early stop.
min_solve_steps = 0
