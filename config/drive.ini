[base]
env_name = drive

[vec]
total_agents = 16384
num_buffers = 2
num_threads = 2

# 0 = micro (WOMD, variable agents per scenario)
# 1 = macro (single I24 map, NUM_AGENTS in drive.h)
[env]
mode = 0
human_agent_idx = 0
map_id = 0
map_name = resources/drive/i24/I24_map.bin
reward_vehicle_collision = -0.162279248
reward_offroad_collision = -0.41260618
reward_goal_post_respawn = 0.251913011
reward_vehicle_collision_post_respawn = 0
num_maps = 1000
episode_length = 91

[micro]
num_maps = 1000
map_id = 0
episode_length = 91

[macro]
num_maps = 1
map_name = resources/drive/i24/I24_map.bin
episode_length = 4096

# WOMD Protein sweep run 31 (score 0.9899). num_layers sampled 2.61153221, int-cast to 2.
[policy]
hidden_size = 512
num_layers = 2

[train]
gpus = 1
total_timesteps = 2.07973696e+09
learning_rate = 0.000650572707
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.984240413
gae_lambda = 0.943325341
replay_ratio = 1.66508651
clip_coef = 0.197630331
vf_coef = 2.08930206
vf_clip_coef = 1.0720017
max_grad_norm = 1.49155474
ent_coef = 9.97832758e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.989773035
minibatch_size = 4096
horizon = 64
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto
 
[sweep.env.reward_vehicle_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto 
 
[sweep.env.reward_offroad_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_goal_post_respawn]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto
