[base]
env_name = electric_fish

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
num_layers = 1
hidden_size = 128

[env]
num_agents = 4
# Set min=max for evaluation; use 40 and 300 for paper-style training.
min_arena_width = 70
max_arena_width = 70
min_arena_height = 70
max_arena_height = 70
# 0=uniform, 1=patchy, 2=n_patch, 3=one_patch, 4=random
food_distribution = 4
num_food = 64
# N-patch parameters. Patchy and one-patch use the radius parameters.
num_patches = 4
patch_radius = 6
patch_radius_std = 1.5
patch_density = 0.001
placement_radius_frac = 0.75
electric_field_radius = 15
max_steps = 4096
