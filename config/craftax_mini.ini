[base]
env_name = craftax_mini

[vec]
total_agents = 16384
num_buffers = 16
num_threads = 16

[env]
seed_offset = 0
reset_pool_size = 1024
human_maps = 1
# Goal block ids match Craftax BlockType: diamond=10, sapphire=21, ruby=22.
current_goal_block = 10
max_timesteps = 200

[train]
total_timesteps = 200_000_000
learning_rate = 0.008
ent_coef = 0.02
gamma = 0.997
gae_lambda = 0.95
horizon = 128
minibatch_size = 32768

[policy]
hidden_size = 32
num_layers = 1
expansion_factor = 1
