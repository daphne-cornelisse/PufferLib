[base]
env_name = craftax_mini
gif_log_interval = 300
gif_log_frames = 300

[vec]
total_agents = 16384
num_buffers = 16
num_threads = 16

[env]
# Human-data parity defaults:
# - human_maps=1 cycles the 4 vendored experiment maps by env slot.
# - current_goal_block=0 cycles diamond/sapphire/ruby across env slots.
#   Use 10, 21, or 22 for a fixed diamond, sapphire, or ruby task.
# - max_timesteps=300 matches the human collection timeout.
seed_offset = 0
reset_pool_size = 1024
human_maps = 1
current_goal_block = 0
max_timesteps = 300

[train]
total_timesteps = 10_000_000_000
learning_rate = 0.008
ent_coef = 0.02
gamma = 0.997
gae_lambda = 0.95
horizon = 128
minibatch_size = 32768
use_reg = false
reg_coef = 0.01
anchor_model_path = 'resources/craftax_mini/craftax_mini_anchor_policy.bin'

[policy]
hidden_size = 32
num_layers = 1
expansion_factor = 1
