[base]
env_name = craftax

[vec]
total_agents = 16384
num_buffers = 16
num_threads = 16

[env]
seed_offset = 0
view_mode = 1
# Pre-generated world pool. Each reset memcpys from a pool entry
# instead of re-running generate_world (~ms -> ~us per reset).
# Bounds world diversity: at most reset_pool_size unique maps are
# ever seen per process. Set to 0 to disable (required for the
# parity harness to maintain exact per-seed determinism).
reset_pool_size = 1024

[train]
gpus = 1
seed = 42
total_timesteps = 10_000_000_000
learning_rate = 0.00631942
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995515
gae_lambda = 0.880638
replay_ratio = 2.4456
clip_coef = 0.30064
vf_coef = 2.27328
vf_clip_coef = 0.467107
max_grad_norm = 4.00294
ent_coef = 0.005
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.905585
beta2 = 0.98903
eps = 3.42265e-07 
minibatch_size = 32768
horizon = 128
vtrace_rho_clip = 1.12915
vtrace_c_clip = 1.28552
prio_alpha = 0.607426
prio_beta0 = 0.0742177

[regularize]
use_reg = true
reg_weights_path = 

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[sweep]
method = Protein 
metric = score
downsample = 5

[sweep.train.total_timesteps]
distribution = log_normal
min = 4e9
max = 5e10
mean = 4e9
scale = time

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.005
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0015
max = 0.015
scale = 0.5

[sweep.policy.num_layers]
distribution = uniform
min = 3
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 4
scale = auto
