# Rank 2 logs/craftax/scale8b.ini
# episode_return=125.19  gpus=8  steps=2.0e10
# total_timesteps is GLOBAL under NCCL DP (local ≈ total / world_size).
# Do not use 4096 agents/rank with this LR — that 8-GPU run collapsed.

[base]
env_name = craftax
gpu_offset = 0
profile = 0
checkpoint_dir = checkpoints
log_dir = logs
# 10 checkpoints, evenly spaced. 4768 train epochs on 8 GPUs
# (2.0e10 global / 8 / (2048 agents * 256 horizon)); save every 10%.
checkpoint_interval = 477
eval_episodes = 10000
eval_agents = -1
load_model_path = None
load_enemy_model_path = None
run_id = scale8b
cudagraphs = 1
seed = 73
reset_every_horizon = 0
async = 1

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8
num_policies = 1
hist_policy_hidden_size = 0
hist_policy_num_layers = 0
hist_policy_percent = 0

[selfplay]
enabled = 0
max_size = 16
seed = 42
opp_timeout_steps = 500_000_000
eval_pool_size = 8
eval_games = 0
eval_bot_games = 0

[env]
dr = 0
num_agents = 1
num_bots = 0
reset_pool_size = 8192
action_mask = 1
seed_offset = 0

[policy]
hidden_size = 1024
num_layers = 4

[train]
gpus = 8
total_timesteps = 2.0e10
learning_rate = 0.00472887093
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.999414682
gae_lambda = 0.801190972
replay_ratio = 1.17263889
clip_coef = 0.226401091
vf_coef = 0.78808409
vf_clip_coef = 1.14975154
max_grad_norm = 0.818616688
ent_coef = 0.000213571053
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.930526733
minibatch_size = 32768
horizon = 256
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
