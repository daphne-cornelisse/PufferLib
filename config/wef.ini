[base]
env_name = wef

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
num_layers = 1
hidden_size = 128

[train]
total_timesteps = 50_000_000

[env]
num_agents = 4
# Set min=max for evaluation; use 40 and 300 for paper-style training.
min_arena_width = 70
max_arena_width = 70
min_arena_height = 70
max_arena_height = 70
# 0=uniform, 1=patchy, 2=n_patch, 3=one_patch, 4=random
food_distribution = 4
num_food = 64
# N-patch parameters. Patchy and one-patch use the radius parameters.
num_patches = 4
patch_radius = 6
patch_radius_std = 1.5
patch_density = 0.001
placement_radius_frac = 0.75
electric_field_radius = 15
max_steps = 4096


[sweep]
method = Protein 
metric = score
metric_distribution = linear
goal = maximize

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 3e7
; max = 1e11
; scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

#[sweep.vec.total_agents]
#distribution = uniform_pow2
#min = 256
#max = 16384
#scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 1024
scale = auto

#[sweep.train.minibatch_size]
#distribution = uniform_pow2
#min = 4096
#max = 65536
#scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
# Lower clip is sometimes better but less stable
min = 0.01
max = 1.0
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.9
max = 0.99999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = uniform 
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform 
min = 0.0
max = 1.0
scale = auto
